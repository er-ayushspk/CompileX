        <!-- Left sidebar for file explorer -->
        <div class="sidebar left-sidebar" id="left-sidebar">
            <div class="sidebar-header">
                <h3>Explorer</h3>
                <div class="sidebar-actions">
                    <button id="new-file-btn" title="New File"><i class="fas fa-file"></i></button>
                    <button id="new-folder-btn" title="New Folder"><i class="fas fa-folder"></i></button>
                    <button id="open-folder-btn" title="Open Folder"><i class="fas fa-folder-open"></i></button>

                </div>
            </div>
            <div id="file-explorer" class="file-explorer">
                <!-- File tree will be populated here -->
            </div>
        </div>

        <!-- Gripper for resizing left sidebar -->
        <div class="resizer horizontal-resizer" id="left-resizer"></div>

        <!-- Main content area -->
        <div class="main-content" id="main-content">
            <!-- Tabs for open files -->
            <div class="editor-tabs">
                <ul id="tabs-container">
                    <!-- Tabs will be added here -->
                </ul>
            </div>

            <!-- Code editor container -->
            <div id="editor-container" class="editor-container">
                <div id="editor" style="width: 100%; height: 100%;"></div>
            </div>

            <!-- Gripper for resizing editor/panel vertically -->
            <div class="resizer vertical-resizer" id="editor-resizer"></div>

            <!-- Terminal/Output panel -->
            <div class="panel" id="bottom-panel">
                <div class="panel-header">
                    <div class="panel-tabs">
                        <div class="panel-tab active" data-target="output">Output</div>
                        <div class="panel-tab" data-target="terminal">Terminal</div>
                        <div class="panel-tab" data-target="problems">Problems</div>
                    </div>
                    <div class="panel-actions">
                        <button id="run-btn" title="Run Code"><i class="fas fa-play"></i> Run</button>
                        <button id="download-btn" title="Download File"><i class="fas fa-download"></i> Download</button>
                    </div>
                </div>
                <div class="panel-content">
                    <div id="output" class="panel-section active">
                        <!-- Code output will appear here -->
                    </div>
                    <div id="terminal" class="panel-section">
                        <!-- Terminal will be here -->
                    </div>
                    <div id="problems" class="panel-section">
                        <!-- Problems/errors will be listed here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Gripper for resizing right sidebar -->
        <div class="resizer horizontal-resizer" id="right-resizer"></div>

        <!-- Right sidebar for AI assistant -->
        <div class="sidebar right-sidebar" id="right-sidebar">
            <div class="sidebar-header ai-header">
                <h3>AI Assistant</h3>
                <div class="ai-actions">
                    <button id="agent-clear" title="Clear Chat"><i class="fas fa-broom"></i></button>
                </div>
            </div>
            <div id="ai-assistant" class="ai-assistant">
                <div class="agent-chat" id="agent-chat"></div>
                <div class="agent-input">
                    <textarea id="agent-prompt" placeholder="Ask the AI assistant... (Enter to send, Shift+Enter for new line)"></textarea>
                    <button id="agent-send" title="Send"><i class="fas fa-paper-plane"></i> Send</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Modal for file operations -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modal-title">Create New File</h2>
            <div id="modal-body">
                <!-- Modal content will be dynamically inserted here -->
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    
    <!-- Initialize Monaco and application -->
    <script>
        // Configure Monaco loader
        require.config({
            paths: {
                'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.30.1/min/vs'
            }
        });
        
        // Wait for DOM to be ready
        document.addEventListener('DOMContentLoaded', function() {
            // Load Monaco editor
            require(['vs/editor/editor.main'], function() {
                console.log('Monaco editor loaded from CDN');
                
                // Initialize application components after Monaco is loaded
                setTimeout(function() {
                    try {
                        console.log('Initializing application components...');
                        
                        // Wait for EditorManager class to be available
                        const initEditorManager = (retries = 10) => {
                            if (typeof EditorManager !== 'undefined') {
                                // Initialize editor manager first (it's needed by file explorer)
                                if (!window.editorManager) {
                                    try {
                                        window.editorManager = new EditorManager();
                                        console.log('EditorManager initialized successfully');
                                        
                                        // Initialize file explorer (after EditorManager is ready)
                                        if (!window.fileExplorer) {
                                            window.fileExplorer = new FileExplorer();
                                            console.log('FileExplorer initialized');
                                        } else {
                                            console.log('FileExplorer already initialized');
                                        }
                                    } catch (err) {
                                        console.error('Error initializing EditorManager:', err);
                                    }
                                } else {
                                    console.log('EditorManager already initialized');
                                }
                            } else if (retries > 0) {
                                console.log('Waiting for EditorManager class...', retries);
                                setTimeout(() => initEditorManager(retries - 1), 200);
                            } else {
                                console.error('EditorManager class not found after retries');
                                alert('Error: EditorManager not loaded. Please refresh the page.');
                            }
                        };
                        
                        initEditorManager();
                        
                        // Initialize compiler with API key
                        window.compiler = new Compiler();
                        window.compiler.setApiKey('AIzaSyCDuwoOhkKKwOhPF4yAhXRm1kF4_Kq1VmA');
                        console.log('Compiler initialized with API key');
                        
                        // Initialize code agent
                        window.codeAgent = new CodeAgent();
                        console.log('CodeAgent initialized');
                        
                        // Initialize resizer
                        new Resizer();
                        console.log('Resizer initialized');
                        
                        // Hide page loader after everything is loaded (show for at least 2 seconds)
                        setTimeout(function() {
                            const pageLoader = document.getElementById('page-loader');
                            if (pageLoader) {
                                pageLoader.classList.add('hidden');
                                // Remove from DOM after animation
                                setTimeout(function() {
                                    if (pageLoader.parentNode) {
                                        pageLoader.parentNode.removeChild(pageLoader);
                                    }
                                }, 500);
                            }
                        }, 2000); // Show loader for at least 2 seconds
                        
                        // Don't create welcome file here - let editor.js handle it with createWelcomeTab
                        // This prevents duplicate welcome files
                    } catch (err) {
                        console.error('Error initializing components:', err);
                        // Hide loader even on error
                        const pageLoader = document.getElementById('page-loader');
                        if (pageLoader) {
                            pageLoader.classList.add('hidden');
                        }
                    }
                }, 1500); // Increased delay to ensure editor.js is fully loaded
            });
        });
        
        // Make sure EditorManager is available globally as a fallback
        window.ensureEditorManager = function() {
            if (!window.editorManager && typeof EditorManager !== 'undefined') {
                try {
                    window.editorManager = new EditorManager();
                    console.log('EditorManager initialized via fallback');
                    return true;
                } catch (err) {
                    console.error('Failed to initialize EditorManager:', err);
                    return false;
                }
            }
            return !!window.editorManager;
        };
        
        // Fallback: hide loader if page takes too long to load
        window.addEventListener('load', function() {
            setTimeout(function() {
                const pageLoader = document.getElementById('page-loader');
                if (pageLoader && !pageLoader.classList.contains('hidden')) {
                    pageLoader.classList.add('hidden');
                    setTimeout(function() {
                        if (pageLoader.parentNode) {
                            pageLoader.parentNode.removeChild(pageLoader);
                        }
                    }, 500);
                }
            }, 3000); // Maximum 3 seconds
        });
    </script>
